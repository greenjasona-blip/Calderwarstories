<style>
/* Layout: a writers'-room desk. Left rail of departments; one working surface. The Board is an endless wall where any card holds a whole board inside it. */
:root{
  --bg:#e8ebef; --surface:#f7f8fa; --raise:#ffffff; --wall:#dde1e7; --ink:#15181d; --mute:#5a616e; --faint:#878e9a; --line:#cdd2da; --dot:#b6bdc8; --cork:#b48a5c;
  --accent:#c8372d; --accent-ink:#ffffff; --sel:#2563c9; --ok:#2f7d4f; --warn:#a86d14; --bad:#b4233a;
  --paper-ink:#1c1d21;
  --shadow:0 1px 2px rgba(17,22,30,.10),0 6px 18px rgba(17,22,30,.08);
  --f-disp:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-serif:'IBM Plex Serif',Georgia,serif;
  --f-mono:'Courier Prime','Courier New',ui-monospace,monospace;
  --f-hand:'Caveat','Segoe Print','Comic Sans MS',cursive;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1014; --surface:#161920; --raise:#1d2129; --wall:#0a0c0f; --ink:#e7e9ee; --mute:#a0a7b3; --faint:#6e7582; --line:#2a2f39; --dot:#262b34; --cork:#5a4630;
  --accent:#ee5b4c; --accent-ink:#170806; --sel:#5c9dff; --ok:#5cc489; --warn:#e3a74a; --bad:#f06a80;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1014; --surface:#161920; --raise:#1d2129; --wall:#0a0c0f; --ink:#e7e9ee; --mute:#a0a7b3; --faint:#6e7582; --line:#2a2f39; --dot:#262b34; --cork:#5a4630;
  --accent:#ee5b4c; --accent-ink:#170806; --sel:#5c9dff; --ok:#5cc489; --warn:#e3a74a; --bad:#f06a80;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-body);margin:0;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sel);outline-offset:2px}
h1,h2,h3,h4{margin:0;text-wrap:balance}
h1{font:800 clamp(30px,4vw,46px)/.95 var(--f-disp);text-transform:uppercase;letter-spacing:.005em}
h2{font:700 21px/1.1 var(--f-disp);text-transform:uppercase;letter-spacing:.03em}
h3{font:600 15px/1.3 var(--f-body)}
p{margin:0}
a{color:inherit}
.eyebrow{font:600 11px/1.3 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.help{font-size:12.5px;color:var(--mute);line-height:1.45}
.empty{color:var(--mute);font-size:13px;padding:10px 0}
.mute{color:var(--mute)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row.end{justify-content:flex-end}
.row.between{justify-content:space-between}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stack{display:grid;gap:10px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--raise);color:var(--ink);border-radius:8px;padding:7px 12px;font:600 13px/1.15 var(--f-body);cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--faint)}
.btn svg{width:16px;height:16px;flex:none}
.btn.pri{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn.acc{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--wall)}
.btn.sm{padding:5px 9px;font-size:12px}
.btn.danger{color:var(--bad)}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn:disabled{opacity:.45;cursor:default}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--raise)}
.seg .btn{border:0;border-radius:0}
.panel{background:var(--raise);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.phead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:12px}
.pill{display:inline-flex;align-items:center;gap:5px;font:600 11px/1 var(--f-body);padding:4px 8px;border-radius:999px;background:var(--wall);color:var(--ink);white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--pc,var(--faint))}
.field{display:grid;gap:4px;min-width:0;border:0;padding:0;margin:0}
.field>label,.field>legend,.lab{font:600 11px/1.3 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--mute);padding:0}
.field input[type=text],.field input[type=number],.field input[type=date],.field input[type=time],.field input[type=url],.field input[type=email],.field input:not([type]),.field select,.field textarea,.inp{width:100%;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:7px 9px;font-size:13.5px}
.field textarea{resize:vertical;min-height:64px;line-height:1.45}
.field input[type=color]{width:44px;height:32px;padding:2px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.field.check{display:flex;align-items:center;gap:8px}
.field.check label{text-transform:none;letter-spacing:0;font:500 13.5px var(--f-body);color:var(--ink)}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.chk{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font:500 12.5px var(--f-body);cursor:pointer;background:var(--surface)}
.tw{overflow:auto;max-width:100%}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
th{position:sticky;top:0;background:var(--raise);text-align:left;font:600 11px/1.3 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--mute);padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
td.num,th.num{text-align:right}
tr.click{cursor:pointer}
tr.click:hover td{background:color-mix(in srgb,var(--wall) 55%,transparent)}
.mono{font-family:var(--f-mono)}

/* app shell */
#app{height:100%;display:grid;grid-template-columns:186px minmax(0,1fr);gap:12px}
#rail{display:flex;flex-direction:column;gap:2px;min-height:0;overflow:auto}
.brand{padding:4px 10px 16px}
.brand i{display:block;width:76px;height:9px;margin-bottom:9px;background:repeating-linear-gradient(-45deg,var(--ink) 0 7px,transparent 7px 14px);border:1.5px solid var(--ink)}
.brand b{display:block;font:800 27px/.86 var(--f-disp);text-transform:uppercase;letter-spacing:.01em}
.brand span{font:600 10px var(--f-body);letter-spacing:.2em;text-transform:uppercase;color:var(--accent)}
.nav{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;border:0;background:none;color:var(--mute);font:500 13.5px var(--f-body);cursor:pointer;text-align:left;width:100%}
.nav svg{width:18px;height:18px;flex:none}
.nav:hover{background:var(--surface);color:var(--ink)}
.nav[aria-current="page"]{background:var(--raise);color:var(--ink);box-shadow:var(--shadow)}
.rail-foot{margin-top:auto;padding:12px 10px 4px;display:grid;gap:4px}
.save{font:600 11px/1.2 var(--f-body);color:var(--mute);display:inline-flex;align-items:center;gap:6px}
.save::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--faint)}
.save[data-s="saved"]::before{background:var(--ok)}
.save[data-s="saving"]::before{background:var(--warn)}
.save[data-s="error"]::before{background:var(--bad)}
#main{min-width:0;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.view{flex:1;min-height:0;overflow:auto;padding:22px clamp(16px,3vw,34px) 56px}
.vhead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:20px}
.vhead>div:first-child{display:grid;gap:6px;min-width:0}
.banner{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;border:1px dashed var(--accent);border-radius:10px;padding:10px 14px;margin-bottom:18px;background:color-mix(in srgb,var(--accent) 7%,var(--raise))}

/* home */
.home-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px;align-items:start}
.home-grid .wide{grid-column:1/-1}
.proj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:12px}
.pcard{position:relative;border:1px solid var(--line);border-radius:8px;padding:14px 14px 12px 18px;background:var(--surface);display:grid;gap:7px;align-content:start}
.pcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;border-radius:8px 0 0 8px;background:var(--pc,var(--accent))}
.pcard b{font:800 22px/1 var(--f-disp);text-transform:uppercase}
.pcard .ll{font-size:13px;color:var(--mute);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.bar{height:6px;border-radius:3px;background:var(--wall);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pc,var(--accent))}
.stats{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.agenda{list-style:none;margin:0;padding:0;display:grid}
.agenda li{display:grid;grid-template-columns:64px minmax(0,1fr);gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.agenda .d{font:700 15px/1.1 var(--f-disp);text-transform:uppercase;font-variant-numeric:tabular-nums}
.agenda .d small{display:block;font:500 11px var(--f-body);color:var(--mute);text-transform:none}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,120px),1fr));gap:10px}
.kpi{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--surface)}
.kpi b{display:block;font:800 28px/1.05 var(--f-disp);font-variant-numeric:tabular-nums}

/* slate */
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,1fr);gap:10px;overflow-x:auto;padding-bottom:8px}
.kcol{background:var(--wall);border-radius:8px;padding:8px;display:grid;gap:8px;align-content:start;min-height:160px}
.kcol.over{outline:2px dashed var(--sel);outline-offset:-2px}
.khead{display:flex;justify-content:space-between;padding:2px 4px}
.kcard{position:relative;background:var(--raise);border:1px solid var(--line);border-radius:6px;padding:10px 10px 10px 15px;display:grid;gap:5px;cursor:grab}
.kcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;border-radius:6px 0 0 6px;background:var(--pc)}
.kcard b{font:700 15px/1.15 var(--f-body)}
.kcard .meta{font:600 10.5px var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}

/* board */
.board{flex:1;min-height:0;display:flex;flex-direction:column}
.btop{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--surface)}
.btop select{background:var(--raise);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-weight:600;max-width:200px}
.crumbs{display:flex;align-items:center;gap:2px;min-width:0;overflow-x:auto;flex:1 1 220px}
.crumb{border:0;background:none;padding:3px 7px;border-radius:6px;font:600 13px/1.2 var(--f-body);color:var(--mute);cursor:pointer;white-space:nowrap;text-align:left}
.crumb small{display:block;font:600 9.5px var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.crumb:hover{background:var(--wall)}
.crumb.cur{color:var(--ink)}
.csep{color:var(--faint)}
.bbody{flex:1;min-height:0;display:flex;position:relative}
.vp{flex:1;min-width:0;position:relative;overflow:hidden;background-color:var(--wall);touch-action:none;user-select:none;-webkit-user-select:none}
.vp.bg-dots{background-image:radial-gradient(circle,var(--dot) 1.3px,transparent 1.6px)}
.vp.bg-grid{background-image:linear-gradient(var(--dot) 1px,transparent 1px),linear-gradient(90deg,var(--dot) 1px,transparent 1px)}
.vp.bg-cork{background-color:var(--cork);background-image:radial-gradient(rgba(40,22,6,.28) 1px,transparent 1.6px),radial-gradient(rgba(255,236,200,.16) 1px,transparent 1.6px);background-size:7px 7px,11px 11px!important}
.vp.bg-white{background-color:#fdfdfc;background-image:radial-gradient(circle,#d3d8df 1.3px,transparent 1.6px);color-scheme:light;
  --ink:#15181d;--mute:#5a616e;--faint:#878e9a;--raise:#ffffff;--surface:#f7f8fa;--line:#cdd2da;--wall:#fdfdfc;--dot:#d3d8df;--sel:#2563c9;--bad:#b4233a;--shadow:0 1px 2px rgba(17,22,30,.10),0 6px 18px rgba(17,22,30,.08)}
.vp.pan,.vp.pan .it{cursor:grab}
.vp.panning,.vp.panning .it{cursor:grabbing}
.vp.create{cursor:crosshair}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#lnk{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none;color:var(--mute)}
#lnk .ln{stroke:currentColor;stroke-width:2.2;fill:none}
#lnk .ln.sel{stroke:var(--sel);stroke-width:3}
#lnk .lnh{stroke:transparent;stroke-width:16;fill:none;pointer-events:stroke;cursor:pointer}
#lnk text{font:600 13px var(--f-body);fill:var(--ink);paint-order:stroke;stroke:var(--wall);stroke-width:4px}
.it{position:absolute;color:var(--paper-ink)}
.it.sel{outline:2px solid var(--sel);outline-offset:3px}
.it.arming{outline:3px solid var(--sel);outline-offset:6px;animation:arm .6s ease-in-out infinite alternate}
@keyframes arm{from{outline-offset:4px;outline-color:color-mix(in srgb,var(--sel) 45%,transparent)}to{outline-offset:10px;outline-color:var(--sel)}}
.it.culled{display:none}
.ptile.lod .pvw{display:none}
.ptile.lod::after{content:"";position:absolute;inset:200px 40px 40px;border-radius:14px;background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--pc) 14%,transparent) 0 18px,transparent 18px 36px)}
.passes{display:flex;gap:3px;flex-wrap:wrap}
.pass{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:2px 7px;font:600 10.5px/1.3 var(--f-body);cursor:pointer;color:var(--mute)}
.pass.done{background:var(--ok);border-color:var(--ok);color:#fff}
.pass.next{border-color:var(--ink);color:var(--ink)}
.it.room{background:#111317;color:#e9e6df;border-radius:22px;box-shadow:0 0 0 3px var(--rc),0 24px 60px rgba(0,0,0,.25);overflow:hidden;border:2px dashed color-mix(in srgb,var(--rc) 60%,transparent)}
.room .rin{position:absolute;inset:0;padding:44px 48px;display:grid;grid-template-columns:1.1fr .9fr;gap:40px}
.room .rk{font:600 20px/1 var(--f-body);letter-spacing:.2em;text-transform:uppercase;color:var(--rc)}
.room .rn{font:var(--rf);margin:14px 0 18px;line-height:.95;color:#f4f1ea}
.room .rd{font:400 25px/1.4 var(--f-body);color:#b9b5ab;max-width:22em}
.room .ra{margin-top:28px;display:grid;gap:12px;font:600 24px/1.2 var(--f-mono);color:#d8d3c8}
.room .ra i{font-style:normal;color:var(--rc);margin-right:12px}
.room .rcta{position:absolute;left:48px;bottom:40px;font:600 22px var(--f-body);color:#f4f1ea;display:flex;gap:16px;align-items:center}
.room .rcta b{border:2px solid var(--rc);border-radius:999px;padding:8px 20px;color:var(--rc);font:700 18px var(--f-body);letter-spacing:.12em;text-transform:uppercase}
.room .rpv{position:relative;align-self:center;height:420px;border:1px solid #2c2f36;border-radius:14px;background:#0a0b0e}
.room .rpv i{position:absolute;border-radius:6px}
.room>.dive{position:absolute;right:40px;bottom:36px;font-size:20px;padding:8px 22px;border-width:2px;background:#f4f1ea}
.rlay{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.rlay button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 6px;cursor:pointer;font:600 12px var(--f-body);display:grid;gap:4px;justify-items:center}

.rlay i{position:absolute;border-radius:2px}
.rlay button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.rbeats{margin:0;padding-left:18px;font-size:12.5px;display:grid;gap:3px;color:var(--mute)}
.rbeats b{color:var(--ink)}
.pipe{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:3px}
.pstep{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 6px;text-align:left;cursor:pointer;display:grid;gap:1px;min-width:0}
.pstep small{font:600 9px/1.2 var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.pstep span{font:600 11.5px/1.25 var(--f-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pstep.ok{border-color:color-mix(in srgb,var(--ok) 55%,var(--line))}.pstep.ok small{color:var(--ok)}
.pstep.todo{border-style:dashed}
.hc li{padding:3px 0}.hc .pass-ok{color:var(--ok)}.hc .pass-bad{color:var(--bad)}
.bkwarn{border:1px solid var(--warn);color:var(--warn);background:none;border-radius:7px;padding:4px 8px;font:600 11px var(--f-body);cursor:pointer;text-align:left}
.it.dim{opacity:.16}
.it .rz{position:absolute;right:-8px;bottom:-8px;width:14px;height:14px;border-radius:3px;background:var(--sel);border:2px solid var(--raise);cursor:nwse-resize;display:none;z-index:2}
.it.sel .rz{display:block}
.phx{opacity:.45}
.it [contenteditable]{outline:2px solid var(--sel);outline-offset:2px;background:rgba(255,255,255,.9);color:var(--paper-ink);cursor:text;user-select:text;-webkit-user-select:text;border-radius:2px}
.it.section{background:color-mix(in srgb,var(--c) 34%,transparent);border:2px dashed color-mix(in srgb,var(--c) 75%,var(--ink) 25%);border-radius:16px}
.section .sh{padding:14px 20px;display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline}
.section .t{font:800 36px/1 var(--f-disp);text-transform:uppercase;color:var(--ink)}
.section .sm{font:500 15px var(--f-body);color:var(--mute)}
.it.card{background:var(--c);border-radius:3px;box-shadow:0 1px 1px rgba(0,0,0,.14),0 6px 16px -4px rgba(0,0,0,.22);display:flex;flex-direction:column;padding:9px 12px 8px 17px;overflow:hidden}
.stripes{position:absolute;left:0;top:0;bottom:0;width:6px;display:flex;flex-direction:column}
.stripes i{flex:1}
.card .ch{display:flex;justify-content:space-between;align-items:center;gap:6px;font:600 10.5px/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:rgba(28,29,33,.62);min-height:18px}
.card .t{font:700 16px/1.2 var(--f-body);border-bottom:1.5px solid rgba(200,55,45,.6);padding:3px 0 4px;overflow:hidden;max-height:3.9em}
.card .b{flex:1;min-height:0;overflow:hidden;white-space:pre-wrap;font:13px/20px var(--f-body);background-image:linear-gradient(transparent 19px,rgba(56,104,186,.26) 19px 20px);background-size:100% 20px;padding-top:2px}
.card .b.back{font:500 19px/20px var(--f-hand);background-image:none}
.tagst{display:inline-flex;align-items:center;gap:4px;font:600 9.5px/1 var(--f-body);letter-spacing:.06em;padding:3px 6px;border-radius:999px;background:rgba(0,0,0,.07)}
.tagst::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--pc)}
.flip{border:0;background:none;font:600 9.5px var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:rgba(28,29,33,.55);cursor:pointer;padding:2px 3px;border-radius:3px}
.flip:hover{background:rgba(0,0,0,.08)}
.cf{display:flex;align-items:center;gap:6px;margin-top:5px;min-height:20px}
.dive{margin-left:auto;border:1px solid rgba(28,29,33,.28);background:rgba(255,255,255,.6);color:var(--paper-ink);border-radius:999px;padding:2px 9px;font:600 11px/1.3 var(--f-body);cursor:pointer;white-space:nowrap}
.dive:hover{background:#fff;border-color:rgba(28,29,33,.6)}
.mini{display:grid;grid-template-columns:repeat(6,7px);gap:2px}
.mini i{height:5px;border-radius:1px;background:var(--mc);outline:1px solid rgba(0,0,0,.18)}
.it.note{background:var(--c);rotate:var(--r);box-shadow:0 1px 1px rgba(0,0,0,.12),0 12px 18px -8px rgba(0,0,0,.35);padding:16px 14px 10px;display:flex;flex-direction:column}
.note .t{flex:1;overflow:hidden;white-space:pre-wrap;word-break:break-word;font:600 23px/1.12 var(--f-hand)}
.note .stripes{width:100%;height:6px;flex-direction:row;bottom:auto}
.it.frame{background:var(--raise);color:var(--ink);border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;padding:8px 9px 7px}
.frame .stripes{width:100%;height:4px;flex-direction:row;bottom:auto;border-radius:6px 6px 0 0;overflow:hidden}
.fh{display:flex;gap:8px;align-items:baseline;font:600 10.5px/1.1 var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--mute);white-space:nowrap;overflow:hidden}
.fh b{font:800 19px/1 var(--f-disp);color:var(--ink);letter-spacing:.02em}
.fh .dur{margin-left:auto}
.fimg{flex:1;min-height:0;background:#fff;border:1.5px solid #1c1d21;display:grid;place-items:center;overflow:hidden;position:relative}
.fimg img{width:100%;height:100%;object-fit:contain;display:block}
.fimg span{color:#80858e;font-size:12px}
.fmove{position:absolute;right:5px;bottom:5px;font:700 9.5px/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase;background:#1c1d21;color:#fff;padding:3px 5px;border-radius:3px}
.fcap{font:13px/1.3 var(--f-body);max-height:3.95em;overflow:hidden;white-space:pre-wrap}
.fdl{font:12.5px/1.3 var(--f-mono);color:var(--mute);max-height:2.6em;overflow:hidden}
.it.text .t{display:block;font:800 46px/1 var(--f-disp);text-transform:uppercase;color:var(--ink);white-space:pre-wrap}
.it.image{background:var(--raise);box-shadow:var(--shadow);padding:7px 7px 0;display:flex;flex-direction:column;color:var(--ink)}
.it.image img{flex:1;min-height:0;width:100%;object-fit:cover;display:block}
.it.image .cap{font:500 12.5px/26px var(--f-body);height:26px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.it.ptile{background:var(--raise);border-radius:22px;box-shadow:0 0 0 3px var(--pc),0 24px 60px rgba(0,0,0,.16);overflow:hidden;color:var(--ink)}
.pvw{position:absolute;inset:0;pointer-events:none}
.pvbox{position:absolute;left:0;top:0;transform-origin:0 0}
.pvw .rz,.pvw .dive,.pvw .flip{visibility:hidden}
.phd{position:absolute;left:40px;right:220px;top:30px;display:grid;gap:6px;background:linear-gradient(var(--raise) 80%,transparent);padding-bottom:10px}
.phd .pk{font:600 18px/1 var(--f-body);letter-spacing:.16em;text-transform:uppercase;color:var(--pc)}
.phd b{font:800 72px/.88 var(--f-disp);text-transform:uppercase}
.phd .pl{font:500 21px/1.3 var(--f-body);color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptile>.dive{position:absolute;right:32px;top:34px;font-size:20px;padding:8px 20px;border-width:2px}
.pempty{position:absolute;left:0;right:0;top:55%;text-align:center;font:500 26px var(--f-body);color:var(--faint)}
.it.sticky{background-color:var(--c);box-shadow:0 1px 2px rgba(0,0,0,.14),0 10px 18px -8px rgba(0,0,0,.3);padding:24px 16px 12px;display:flex;flex-direction:column;background-image:linear-gradient(transparent 27px,rgba(56,104,186,.16) 27px 28px);background-size:100% 28px;background-position:0 23px}
.sticky .tape{position:absolute;left:50%;top:-11px;width:96px;height:26px;transform:translateX(-50%) rotate(-2.5deg);background:rgba(255,255,255,.6);border:1px solid rgba(0,0,0,.07);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.sticky .t{flex:1;overflow:hidden;white-space:pre-wrap;word-break:break-word;font:400 16px/28px var(--f-mono)}
.sticky .stripes{width:100%;height:5px;flex-direction:row;bottom:auto}
.it.timeline{color:var(--ink)}
.timeline .t{display:block;font:800 24px/1 var(--f-disp);text-transform:uppercase;letter-spacing:.02em}
.timeline .tl{position:absolute;left:0;right:14px;top:62%;height:5px;border-radius:3px;background:var(--c)}
.timeline .tl::after{content:"";position:absolute;right:-14px;top:-7px;border:9px solid transparent;border-left:14px solid var(--c);border-right:0}
.timeline .tm{position:absolute;top:-9px;transform:translateX(-50%);width:0}
.timeline .tm i{display:block;width:5px;height:23px;margin-left:-2.5px;border-radius:2px;background:var(--c)}
.timeline .tm em{position:absolute;left:0;transform:translateX(-50%);font:600 14px/1.25 var(--f-body);font-style:normal;white-space:nowrap;max-width:240px;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.timeline .tm em.up{bottom:30px}
.timeline .tm em.dn{top:30px}
.it.ink svg{display:block;overflow:visible}
.it.ink.sel{outline-style:dashed}
.card .clk{margin-left:8px;color:rgba(28,29,33,.75);letter-spacing:.02em}
.card .jr{font:600 10px/1.2 var(--f-body);letter-spacing:.07em;text-transform:uppercase;color:rgba(28,29,33,.55);margin-top:3px}
.card .eye{display:inline-block;width:9px;height:9px;border-radius:50%;background:#1c1d21}
.card .fmt{font:600 9.5px/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase;border:1px solid rgba(28,29,33,.3);padding:3px 5px;border-radius:2px;color:rgba(28,29,33,.7)}
.card.st-open::after,.card.st-prop::after{content:"";position:absolute;inset:4px;border:1.5px dashed rgba(28,29,33,.45);border-radius:2px;pointer-events:none}
.card.st-prop::after{border-style:dotted;border-width:2px}
.aud{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;width:100%;font:600 13px var(--f-body);color:var(--mute)}
.aud span{display:inline-flex;align-items:center;gap:5px}
.aud i{width:11px;height:11px;border-radius:2px}
.aud em{font-style:normal;color:var(--bad)}
.penpal{position:absolute;left:62px;top:12px;display:flex;flex-direction:column;gap:6px;background:var(--raise);border:1px solid var(--line);border-radius:10px;padding:6px;box-shadow:var(--shadow);z-index:5}
.penpal .sw{width:26px;height:26px}
.penpal .pw{width:26px;height:26px;border:1px solid var(--line);border-radius:6px;background:var(--raise);display:grid;place-items:center;cursor:pointer;padding:0}
.penpal .pw i{display:block;width:16px;border-radius:9px;background:var(--ink)}
.penpal .pw[aria-pressed="true"]{outline:2px solid var(--sel);outline-offset:1px}
.tools{position:absolute;left:max(12px,env(safe-area-inset-left,0px));top:12px;display:flex;flex-direction:column;gap:2px;max-height:calc(100% - 70px);overflow-y:auto;scrollbar-width:none;background:var(--raise);border:1px solid var(--line);border-radius:10px;padding:4px;box-shadow:var(--shadow);z-index:5}
.tool{width:36px;height:36px;border:0;border-radius:7px;background:none;color:var(--mute);display:grid;place-items:center;cursor:pointer}
.tool svg{width:19px;height:19px}
.tool:hover{color:var(--ink);background:var(--wall)}
.tool[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.tsep{height:1px;background:var(--line);margin:3px 4px}
.zoomer{position:absolute;right:12px;bottom:12px;display:flex;align-items:center;gap:2px;background:var(--raise);border:1px solid var(--line);border-radius:10px;padding:3px;box-shadow:var(--shadow);z-index:5}
.zoomer button{border:0;background:none;border-radius:7px;min-width:32px;height:30px;cursor:pointer;color:var(--ink);font:600 12px var(--f-body);display:grid;place-items:center;padding:0 6px;font-variant-numeric:tabular-nums}
.zoomer button:hover{background:var(--wall)}
.zoomer svg{width:16px;height:16px}
.lvl{position:absolute;left:12px;bottom:12px;display:flex;flex-direction:row-reverse;align-items:center;gap:8px;background:var(--raise);border:1px solid var(--line);border-radius:999px;padding:4px 12px 4px 4px;box-shadow:var(--shadow);z-index:5;font:600 11px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--mute);max-width:calc(100% - 230px);white-space:nowrap;overflow:hidden}
.lvl>span{overflow:hidden;text-overflow:ellipsis;padding-left:8px}
.lvl .btn{border-radius:999px}
.lvl b{color:var(--ink)}
.hintbar{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);text-align:center;display:grid;gap:10px;justify-items:center;max-width:min(420px,80%);z-index:4;background:var(--raise);border:1px solid var(--line);border-radius:12px;padding:20px;box-shadow:var(--shadow)}
#marq{position:absolute;border:1px solid var(--sel);background:color-mix(in srgb,var(--sel) 12%,transparent);pointer-events:none;z-index:6}
.insp{width:300px;flex:none;border-left:1px solid var(--line);background:var(--surface);overflow:auto;padding:14px;display:grid;gap:14px;align-content:start}
.ih{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ibox{border:1px solid var(--line);border-radius:8px;padding:10px;display:grid;gap:8px;background:var(--raise)}
.swatches{display:flex;flex-wrap:wrap;gap:6px}
.sw{width:24px;height:24px;border-radius:6px;border:1px solid rgba(0,0,0,.22);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{outline:2px solid var(--sel);outline-offset:2px}
.trk{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--raise);border-radius:999px;padding:4px 9px;font:600 12px var(--f-body);cursor:pointer}
.trk i{width:10px;height:10px;border-radius:2px;background:var(--tc)}
.trk[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.trow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px;align-items:center}
.frameprev{background:#fff;border:1.5px solid #1c1d21;min-height:64px;display:block;overflow:hidden;text-align:center}
.frameprev img{display:block;width:100%;height:auto}
.frameprev .help{display:block;padding:22px 8px;color:#80858e}
.mats{margin:0;padding-left:18px;display:grid;gap:4px;font-size:12.5px;line-height:1.4}
.mats a{color:var(--sel);word-break:break-all}
.keys{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:12px;color:var(--mute)}
.keys kbd{font:600 11px var(--f-body);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:1px 5px;background:var(--raise);color:var(--ink);justify-self:start;white-space:nowrap}
.only-narrow{display:none}
.outline{flex:1;min-width:0;overflow:auto;padding:18px clamp(16px,3vw,32px) 60px}
.olb{display:grid}
.olsec{font:800 18px/1.1 var(--f-disp);text-transform:uppercase;letter-spacing:.03em;padding:14px 0 6px;color:var(--mute)}
.olr{display:grid;grid-template-columns:24px 64px minmax(0,1fr) auto;gap:8px;align-items:start;padding:6px 0;border-bottom:1px solid var(--line)}
.olr .tg{border:0;background:none;cursor:pointer;color:var(--mute);padding:4px 0;font-size:12px}
.olr .n{font:700 14px/2 var(--f-disp);color:var(--mute);font-variant-numeric:tabular-nums}
.olr input{width:100%;border:1px solid transparent;background:transparent;border-radius:6px;padding:4px 6px;font:600 14px var(--f-body)}
.olr input:hover,.olr input:focus{border-color:var(--line);background:var(--raise)}
.olr .ex{font-size:12.5px;color:var(--mute);padding:0 6px;white-space:pre-wrap}
.olkids{margin-left:28px;border-left:2px solid var(--line);padding-left:12px}
.olkids .olkh{font:600 10.5px var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--faint);padding:8px 0 2px}

/* docs */
.doc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:16px}
.dcard{border:1px solid var(--line);border-radius:10px;background:var(--raise);overflow:hidden;display:grid}
.dthumb{background:var(--wall);display:grid;place-items:center;padding:14px;height:220px;overflow:hidden;cursor:pointer;border:0;width:100%}
.tscale{overflow:hidden;position:relative;flex:none}
.dthumb .tscale{box-shadow:0 2px 10px rgba(0,0,0,.2)}
.dmeta{padding:10px 12px;display:grid;gap:6px}
.tpl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,190px),1fr));gap:10px}
.tpl{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:12px;text-align:left;cursor:pointer;display:grid;gap:4px;align-content:start}
.tpl:hover{border-color:var(--ink)}
.tpl b{font:800 18px/1 var(--f-disp);text-transform:uppercase}
.tpl small{font:600 10px var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.docs-ed{flex:1;min-height:0;display:flex;flex-direction:column}
.dbody{flex:1;min-height:0;display:grid;grid-template-columns:150px minmax(0,1fr) 300px}
.pages{overflow:auto;border-right:1px solid var(--line);padding:10px;display:grid;gap:12px;align-content:start;background:var(--surface)}
.pth{display:grid;gap:4px;justify-items:center}
.pth button.pt{border:2px solid transparent;padding:0;background:none;cursor:pointer;border-radius:3px;overflow:hidden;position:relative;display:block}
.pth button.pt[aria-current="true"]{border-color:var(--sel)}
.pth .pn{font:600 11px var(--f-body);color:var(--mute);display:flex;gap:2px;align-items:center}
.pth .pn button{border:0;background:none;cursor:pointer;color:var(--mute);padding:2px 4px;border-radius:4px;font-size:12px}
.pth .pn button:hover{background:var(--wall);color:var(--ink)}
.dbody .insp{width:auto;min-width:0}
.field .row select{width:auto;flex:1 1 0;min-width:0}
.stage{overflow:auto;background:var(--wall);padding:28px;display:grid;justify-items:center;align-content:start}
.pagewrap{position:relative;box-shadow:0 3px 18px rgba(0,0,0,.22);flex:none}
.pscale{position:absolute;left:0;top:0;transform-origin:0 0}
.page{position:relative;overflow:hidden}
.blk{position:absolute;overflow:hidden;white-space:pre-wrap;overflow-wrap:break-word}
.edit .blk{cursor:move}
.edit .blk:hover{outline:1px dashed rgba(37,99,201,.6)}
.edit .blk.sel{outline:calc(2px / var(--s,1)) solid #2563c9;overflow:visible}
.edit .blk .rz{position:absolute;right:calc(-7px / var(--s,1));bottom:calc(-7px / var(--s,1));width:calc(14px / var(--s,1));height:calc(14px / var(--s,1));background:#2563c9;border:calc(2px / var(--s,1)) solid #fff;border-radius:3px;cursor:nwse-resize;display:none}
.edit .blk.sel .rz{display:block}
.edit .blk [contenteditable],.edit .blk[contenteditable]{cursor:text;outline:calc(2px / var(--s,1)) solid #2563c9}
.blk .ph{opacity:.4}
.blk.im{background:rgba(127,127,127,.12)}
.blk.im.has{background:none}
.blk.im img{width:100%;height:100%;display:block}
.blk.im .ph{display:grid;place-items:center;height:100%;font:500 20px var(--f-body);color:#777;opacity:1}
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-height:240px;overflow:auto}
.gallery button{border:1px solid var(--line);padding:0;background:#fff;cursor:pointer;aspect-ratio:16/10;overflow:hidden;border-radius:4px}
.gallery img{width:100%;height:100%;object-fit:cover;display:block}

/* portfolio / resume / social */
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:18px;align-items:start}
.profile{display:grid;grid-template-columns:120px minmax(0,1fr);gap:16px;align-items:start}
.headshot{width:120px;aspect-ratio:4/5;border-radius:8px;background:var(--wall);overflow:hidden;display:grid;place-items:center;color:var(--faint);font-size:12px;border:1px solid var(--line)}
.headshot img{width:100%;height:100%;object-fit:cover}
.preview{width:100%;height:min(76vh,880px);border:1px solid var(--line);border-radius:10px;background:#fff;display:block}
.acct-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:10px}
.acct{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:12px;display:grid;gap:6px;cursor:pointer;text-align:left}
.acct:hover{border-color:var(--faint)}
.acct .pf{display:flex;align-items:center;gap:8px}
.acct .pf i{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;font:800 14px var(--f-disp);color:#fff;background:var(--pc);font-style:normal}
.acct b{font:800 26px/1 var(--f-disp);font-variant-numeric:tabular-nums}
.meter{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;font-size:12px;font-variant-numeric:tabular-nums}
.meter .bar i{background:var(--mc,var(--ok))}
.over{color:var(--bad);font-weight:600}
.composer{display:grid;gap:10px}
.counts{display:grid;gap:6px}
.postlist{display:grid;gap:8px}
.post{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--surface);display:grid;gap:6px}
.post .txt{white-space:pre-wrap;font-size:13.5px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font:600 10.5px/1 var(--f-body);letter-spacing:.04em;padding:4px 7px;border-radius:999px;border:1px solid var(--line);background:var(--raise);white-space:nowrap}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dow{font:600 11px var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--mute);padding:4px}
.cday{min-height:96px;background:var(--raise);border:1px solid var(--line);border-radius:6px;padding:5px;display:flex;flex-direction:column;gap:3px;cursor:pointer;min-width:0;text-align:left}
.cday.out{opacity:.45}
.cday.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.cday .dn{font:700 14px var(--f-disp);font-variant-numeric:tabular-nums}
.cev{font:500 11px/1.25 var(--f-body);padding:2px 5px;border-radius:4px;background:color-mix(in srgb,var(--ec) 18%,transparent);border-left:3px solid var(--ec);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmore{font-size:11px;color:var(--mute)}
.cal-wrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}

/* drawer, modal, toast */
.scrim{position:fixed;inset:0;background:rgba(10,12,16,.45);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(30rem,100%);background:var(--raise);border-left:1px solid var(--line);z-index:41;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer form{display:flex;flex-direction:column;min-height:0;flex:1}
.d-head{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
.d-body{padding:16px 18px;overflow:auto;display:grid;gap:12px;flex:1;align-content:start}
.d-foot{padding:12px 18px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center}
.err{color:var(--bad);font-size:13px}
.imgf{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.imgprev{width:72px;height:90px;border-radius:6px;background:var(--wall);overflow:hidden;display:grid;place-items:center;font-size:11px;color:var(--faint)}
.imgprev img{width:100%;height:100%;object-fit:cover}
.llout{display:grid;gap:6px}

/* =================== cloud sync (v1.5) ===================
   One studio everywhere: when this page runs as the claude.ai artifact, the whole state is mirrored
   to the artifact's private database (owner-only) in content-addressed chunks. Any device that opens
   the studio link pulls the newest copy; edits push a few seconds after they're saved locally.
   A local file copy cannot reach the cloud, so it says so and links to the synced studio. */
const EDITION=typeof EDITION_KIND!=='undefined'?EDITION_KIND:'product';
const APP_NAME=typeof PERSONAL_NAME!=='undefined'?PERSONAL_NAME:'Writers Room';
const APP_SLUG=typeof PERSONAL_STORE!=='undefined'?PERSONAL_STORE:'writers-room';
const CLOUD_URL=typeof PERSONAL_CLOUD_URL!=='undefined'?PERSONAL_CLOUD_URL:'';
const DEVICE=(()=>{try{let d=localStorage.getItem('jgs.device');if(!d){d=uid('d');localStorage.setItem('jgs.device',d)}return d}catch(e){return uid('d')}})();
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const Cloud={db:null,on:false,rev:null,pushedAt:0,meta:null,known:new Set(),pushT:0,pushing:false,again:false,pulling:false,deferT:0,status:'off',
  CH:60000,
  hid(s){let a=0x811c9dc5,b=5381;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);a=Math.imul(a^c,16777619);b=(Math.imul(b,33)+c)|0}return 'c-'+(a>>>0).toString(36)+(b>>>0).toString(36)+'-'+s.length.toString(36)},
  split(o){const parts=[];for(const k of Object.keys(o).sort()){if(k==='ui')continue;
      if(k==='boards'&&o.boards&&typeof o.boards==='object'){for(const id of Object.keys(o.boards))parts.push(['b:'+id,JSON.stringify(o.boards[id])])}
      else if(k==='docs'&&Array.isArray(o.docs)){o.docs.forEach((d,i)=>parts.push(['d:'+i,JSON.stringify(d)]))}
      else parts.push(['k:'+k,JSON.stringify(o[k])])}
    return parts},
  ids(meta){const s=new Set();(meta&&meta.parts||[]).forEach(p=>p.c.forEach(c=>s.add(c)));return s},
  async call(fn){for(let i=0;i<6;i++){try{return await fn()}catch(e){const c=e&&e.code;if(c==='resource_exhausted'||c==='unavailable'){await sleep(800*(i+1)+Math.random()*400);continue}throw e}}throw {code:'unavailable',message:'gave up after retries'}},
  setStatus(s,t){this.status=s;const el=$('#saveSt');if(!el)return;el.dataset.s=s==='synced'?'saved':s==='error'?'error':'saving';el.textContent=t},
  stamp(){return new Date().toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'})},
  async init(){
    const note=$('#railNote');
    const off=why=>{this.on=false;if(note&&why)note.innerHTML=why};
    if(!CLOUD_URL){off('');return}
    if(!window.claude||typeof window.claude.use!=='function'){off(`Local copy: saves on this computer only. <a href="${CLOUD_URL}" target="_blank" rel="noopener">Open synced studio</a>`);return}
    let db=null,owner=false;
    try{const u=await window.claude.use('user');owner=u?await u.isOwner():false}catch(e){}
    if(!owner){off('');return}
    try{db=await window.claude.use('db')}catch(e){db=null}
    if(!db){off('Cloud sync unavailable in this view. Saving on this device.');return}
    this.db=db;this.on=true;if(note)note.textContent='';
    this.rev=await DB.get('cloud.rev');this.pushedAt=Number(await DB.get('cloud.pushedAt'))||0;
    this.setStatus('saving','Checking cloud…');
    let m=null;try{const s=await this.call(()=>db.doc('sync/meta').get());m=s.exists?s.data():null}catch(e){this.setStatus('error','Cloud check failed. Saved on this device');console.error('cloud',e);return}
    if(!m){if(S.projects.length)await this.push();else this.setStatus('synced','Cloud ready')}
    else{this.meta=m;this.known=this.ids(m);
      const dirty=(S.savedAt||0)>this.pushedAt;
      if(m.rev===this.rev){if(dirty)await this.push();else this.setStatus('synced','Synced '+this.stamp())}
      else if(!this.rev){await this.pull(m,'first')}
      else if(dirty&&(S.savedAt||0)>(m.at||0)){await this.push()}

    document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&this.pushT){clearTimeout(this.pushT);this.pushT=0;this.push()}});
  },
  busy(){return !!(UI.editing||UI.drag||!$('#drawer').hidden||!$('#modal').hidden)},
  remote(m){clearTimeout(this.deferT);
    if(this.busy()||this.pushing){this.deferT=setTimeout(()=>this.remote(m),2500);return}
    const dirty=(S.savedAt||0)>this.pushedAt||!!this.pushT;

  schedule(){if(!this.on)return;clearTimeout(this.pushT);this.setStatus('saving','Saved here · syncing…');this.pushT=setTimeout(()=>{this.pushT=0;this.push()},2500)},
  async push(){if(!this.on)return;if(this.pushing||this.pulling){this.again=true;return}this.pushing=true;this.again=false;
    try{const at=S.savedAt||Date.now();const parts=this.split(S);const list=[];let bytes=0;const db=this.db;
      for(const [k,json] of parts){const c=[];bytes+=json.length;
        for(let i=0;i<json.length||i===0;i+=this.CH){const piece=json.slice(i,i+this.CH);const id=this.hid(piece);c.push(id);

      const ui=S&&S.ui;S=migrate(o);if(ui&&(!ui.board||S.boards[ui.board]))S.ui=ui;else S.ui={view:(ui&&ui.view==='board')?'home':(ui&&ui.view)||'home',project:null,board:null};
      try{ensureWorld();gcBoards()}catch(e){}
      HIST.past=[];HIST.future=[];applyTheme();
      this.rev=m.rev;this.meta=m;this.known=this.ids(m);this.pushedAt=S.savedAt||m.at||Date.now();
      await DB.set('state',JSON.stringify(S));await DB.set('cloud.rev',m.rev);await DB.set('cloud.pushedAt',String(this.pushedAt));
      renderBk();render();this.setStatus('synced','Synced '+this.stamp()+' · all devices');
      if(why!=='first'||S.projects.length)toast(why==='first'?'Loaded your studio from the cloud':'Updated from your other device')}
    catch(e){console.error('cloud pull',e);this.setStatus('error','Could not get the latest. Retrying…');setTimeout(async()=>{try{const s=await this.db.doc('sync/meta').get();if(s.exists&&s.data().rev!==this.rev)this.pull(s.data(),why)}catch(e){}},5000)}
    finally{this.pulling=false;if(this.again)this.schedule()}}
};

const MOD={onClose:null,click:null};
function trapFocus(root,e){if(e.key!=='Tab')return;const f=[...root.querySelectorAll('a[href],button:not([disabled]),input:not([type=hidden]),select,textarea,[tabindex]:not([tabindex="-1"])')].filter(x=>x.offsetParent!==null);if(!f.length)return;const a=f[0],z=f[f.length-1];if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}}

function openModal(html,{wide=false,onClose=null,click=null}={}){if($('#modal').hidden)modalReturn=document.activeElement;$('#mBody').innerHTML=html;$('#modal').classList.toggle('wide',wide);$('#modal').hidden=false;$('#mScrim').hidden=false;MOD.onClose=onClose;MOD.click=click;

let toastT=0;
function toast(t){const el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,2400)}
function copyText(text,label='Copied'){
  const fallback=()=>{openModal(`<h3>Copy this text</h3><p class="help">Your browser blocked automatic copying. The text is selected; press Ctrl+C (or ⌘C).</p><textarea id="copyBox" class="inp" rows="12" style="width:100%;font:12px/1.4 var(--f-mono)">${esc(text)}</textarea><div class="row end"><button class="btn pri" data-close>Done</button></div>`,{wide:true,click:e=>{if(e.target.closest('[data-close]'))closeModal()}});setTimeout(()=>{const b=$('#copyBox');b&&(b.focus(),b.select())},60)};

/* Inside the claude.ai viewer a page can't download directly: hand the file over through the downloads capability. */
async function viewerSave(name,data){try{if(!window.claude||typeof window.claude.use!=='function')return false;const dl=await window.claude.use('downloads');if(!dl)return false;
  await dl.save({filename:name,data});toast('Saved '+name);return true}catch(e){const c=e&&e.code;if(c==='declined')return true;if(c==='rate_limited'){toast('Another save is open. Try again in a moment.');return true}
  if(c==='rejected_extension'&&!/\.txt$/i.test(name))return viewerSave(name+'.txt',data);return false}}
function exportFile(name,text,mime='text/html'){
  if(!IS_STANDALONE){viewerSave(name,new Blob([text],{type:mime})).then(ok=>{if(!ok)copyText(text,'Downloads are blocked in this preview, so the file contents were copied instead')});return}
  if(IS_STANDALONE){try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:mime}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);toast('Saved '+name);return}catch(e){}}
  copyText(text,'Downloads are blocked in this preview, so the file contents were copied instead')}
function printHTML(html){if(!IS_STANDALONE){openModal(`<h3>Print or save as PDF</h3><p class="help">Printing is blocked inside this embedded preview. Open ${APP_NAME} as its own file or website to print, or use Copy HTML, paste it into a new .html file, and print that.</p><div class="row end"><button class="btn pri" data-close>OK</button></div>`,{click:e=>{if(e.target.closest('[data-close]'))closeModal()}});return}
  const w=window.open('','_blank');if(!w){toast('Allow pop-ups to print');return}w.document.write(html);w.document.close();setTimeout(()=>{try{w.focus();w.print()}catch(e){}},900)}

function readImage(file,max=1600){return new Promise((res,rej)=>{if(!file||!/^image\//.test(file.type))return rej(new Error('not image'));const fr=new FileReader();fr.onload=()=>{const img=new Image();img.onload=()=>{const s=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*s));c.height=Math.max(1,Math.round(img.height*s));const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);res({src:c.toDataURL('image/jpeg',.86),w:c.width,h:c.height})};img.onerror=rej;img.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)})}
function readText(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(String(fr.result));fr.onerror=rej;fr.readAsText(file)})}

function projStats(p){let cards=0,frames=0,notes=0,boards=0;for(const id in S.boards){const b=S.boards[id];if(b.projectId!==p.id)continue;boards++;for(const i of b.items){if(i.type==='card')cards++;else if(i.type==='frame')frames++;else if(i.type==='note')notes++}}

/* =================== agenda =================== */
function agenda(from,to){const out=[];const inR=d=>d&&d>=from&&d<=to;
  S.events.forEach(e=>{if(inR(e.date))out.push({date:e.date,time:e.time||'',title:e.title,kind:e.kind||'Deadline',ref:'events:'+e.id})});
  S.submissions.forEach(s=>{if(inR(s.due)&&!['Passed','Winner'].includes(s.status))out.push({date:s.due,time:'',title:'Due: '+s.target,kind:'Submission',ref:'submissions:'+s.id})});
  S.projects.forEach(p=>{if(inR(p.due))out.push({date:p.due,time:'',title:p.title+' due',kind:'Project due',ref:'projects:'+p.id})});
  S.posts.forEach(p=>{if(inR(p.date)&&p.status!=='Posted')out.push({date:p.date,time:p.time||'',title:'Post: '+(p.text||'').slice(0,48),kind:'Post',ref:'posts:'+p.id})});
  S.contacts.forEach(c=>{if(inR(c.next))out.push({date:c.next,time:'',title:'Follow up: '+c.name,kind:'Meeting',ref:'contacts:'+c.id})});
  return out.sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time))}

  S.projects.filter(p=>!tiles.some(t=>t.pid===p.id)).forEach((p,k)=>{let x,y;
    if(fresh){x=(k%3)*2000;y=Math.floor(k/3)*1400}
    else if(S.ui.board==='WORLD'&&$('#vp')){const [cx,cy]=viewCenter();x=cx-200;y=cy-140}
    else{const bb=bounds(w.items);x=bb.maxX+400;y=tiles.length?Math.min(...tiles.map(t=>t.y)):bb.minY}
    const t=mkItem('project',x,y,{pid:p.id});tiles.push(t);w.items.push(t)});
  for(const t of tiles){const p=projById(t.pid);if(!p)continue;if(!S.boards[p.root]){const r=newBoard(p.id,0,null);p.root=r.id}t.child=p.root;S.boards[p.root].parent={board:'WORLD',item:t.id}}
  return w}
function tileMap(it,root){const items=root?root.items:[];const pw=Math.max(100,it.w-80),ph=Math.max(100,it.h-210);const bb=items.length?bounds(items):{minX:0,minY:0,w:pw,h:ph};
  const s=Math.min(1,pw/Math.max(bb.w,1),ph/Math.max(bb.h,1));return {s,ax:40+(pw-bb.w*s)/2-bb.minX*s,ay:170+(ph-bb.h*s)/2-bb.minY*s}}
function getItem(id,b){b=b||curBoard();return b?b.items.find(i=>i.id===id):null}
function boardChain(b){const out=[b];let c=b,guard=0;while(c.parent&&guard++<50){const pb=S.boards[c.parent.board];if(!pb)break;out.unshift(pb);c=pb}return out}
function boardTitle(b){if(b.id==='WORLD')return 'All projects';if(!b.parent)return projById(b.projectId)?.title||'Untitled';const pb=S.boards[b.parent.board];const it=pb&&pb.items.find(i=>i.id===b.parent.item);
  if(it&&it.type==='project')return projById(it.pid)?.title||'Untitled';return it?(it.title||it.num||'Untitled'):'Untitled'}
function bounds(items){if(!items||!items.length)return {minX:0,minY:0,maxX:0,maxY:0,w:0,h:0};let a=Infinity,b=Infinity,c=-Infinity,d=-Infinity;for(const i of items){a=Math.min(a,i.x);b=Math.min(b,i.y);c=Math.max(c,i.x+i.w);d=Math.max(d,i.y+i.h)}return {minX:a,minY:b,maxX:c,maxY:d,w:c-a,h:d-b}}
function inside(o,s){const cx=o.x+o.w/2,cy=o.y+o.h/2;return cx>s.x&&cx<s.x+s.w&&cy>s.y&&cy<s.y+s.h}
function readingOrder(items){const secs=items.filter(i=>i.type==='section').sort((a,b)=>a.y-b.y||a.x-b.x);
  const key=i=>{const si=secs.findIndex(s=>inside(i,s));return [si<0?999:si,Math.floor(i.y/120),i.x]};
  return items.filter(i=>i.type!=='section').map(i=>({i,k:key(i)})).sort((a,b)=>a.k[0]-b.k[0]||a.k[1]-b.k[1]||a.k[2]-b.k[2]).map(o=>o.i)}

/* ---------- history ---------- */
const HIST={past:[],future:[]};
function snapData(kind,id){if(kind==='board'){const b=S.boards[id];return b?JSON.stringify({items:b.items,links:b.links}):null}const d=S.docs.find(x=>x.id===id);return d?JSON.stringify({pages:d.pages,theme:d.theme,format:d.format}):null}
function snap(kind='board',id){id=id||(kind==='board'?S.ui.board:UI.doc);const data=snapData(kind,id);if(data==null)return;HIST.past.push({kind,id,data});if(HIST.past.length>40)HIST.past.shift();HIST.future=[]}
function applySnap(e){const o=JSON.parse(e.data);if(e.kind==='board'){const b=S.boards[e.id];if(!b)return;b.items=o.items;b.links=o.links}else{const d=S.docs.find(x=>x.id===e.id);if(!d)return;Object.assign(d,o)}}
function undoRedo(redo){const from=redo?HIST.future:HIST.past,to=redo?HIST.past:HIST.future;const e=from.pop();if(!e){toast(redo?'Nothing to redo':'Nothing to undo');return}
  to.push({kind:e.kind,id:e.id,data:snapData(e.kind,e.id)});applySnap(e);
  if(e.kind==='board'){if(S.boards[e.id]&&S.ui.board!==e.id){S.ui.project=S.boards[e.id].projectId;S.ui.board=e.id}UI.sel=new Set([...UI.sel].filter(id=>getItem(id)));if(S.ui.view==='board')renderBoardBody()}
  else if(S.ui.view==='docs'){UI.doc=e.id;const d=S.docs.find(x=>x.id===e.id);if(d&&!d.pages.some(p=>p.id===UI.page))UI.page=d.pages[0]?.id;UI.blk=null;render()}
  save();toast(redo?'Redone':'Undone')}

/* ---------- camera ---------- */
const ZMIN=0.004,ZMAX=16;
function cam(){const b=curBoard();if(!b.cam)b.cam={x:90,y:80,z:1};return b.cam}
let cullRaf=0;function cull(){cullRaf=0;const vp=$('#vp'),b=curBoard();if(!vp||!b)return;const c=cam(),W=vp.clientWidth,H=vp.clientHeight;const mx=W*.75,my=H*.75;
  const ix=$('#items');if(!ix)return;const byId=new Map(b.items.map(i=>[i.id,i]));for(const el of ix.children){const it=byId.get(el.dataset.id);if(!it)continue;const x=c.x+it.x*c.z,y=c.y+it.y*c.z,w=it.w*c.z,h=it.h*c.z;
    const off=x>W+mx||y>H+my||x+w<-mx||y+h<-my||(w<1.5&&h<1.5);const keep=UI.sel.has(it.id)||(UI.editing&&UI.editing.id===it.id);el.classList.toggle('culled',off&&!keep);
    if(it.type==='project')el.classList.toggle('lod',w<260)}}
function applyCam(){const w=$('#world');if(!w)return;const c=cam();w.style.transform=`translate(${c.x}px,${c.y}px) scale(${c.z})`;if(!cullRaf)cullRaf=requestAnimationFrame(cull);
  const vp=$('#vp');if(S.settings.grid!=='cork'){let g=24*c.z;while(g<12)g*=4;vp.style.backgroundSize=`${g}px ${g}px`;vp.style.backgroundPosition=`${c.x}px ${c.y}px`}
  const zp=$('#zPct');if(zp)zp.textContent=Math.round(c.z*100)+'%';save()}
function toWorld(cx,cy){const r=$('#vp').getBoundingClientRect(),c=cam();return [(cx-r.left-c.x)/c.z,(cy-r.top-c.y)/c.z]}
function viewCenter(){const vp=$('#vp');if(!vp)return [0,0];const r=vp.getBoundingClientRect();return toWorld(r.left+r.width/2,r.top+r.height/2)}
function fitTo(rect,padding=60,maxZ=1.4){const vp=$('#vp');if(!vp)return null;const W=vp.clientWidth,H=vp.clientHeight;const z=clamp(Math.min((W-padding*2-56)/Math.max(rect.w,1),(H-padding*2)/Math.max(rect.h,1)),ZMIN,maxZ);return {x:(W-rect.w*z)/2+28-rect.minX*z,y:(H-rect.h*z)/2-rect.minY*z,z}}
function fit(anim=true){const b=curBoard();if(!$('#vp'))return;if(!b.items.length){Object.assign(cam(),{x:90,y:80,z:1});applyCam();return}const t=fitTo(bounds(b.items));if(anim)animCam(t);else{Object.assign(cam(),t);applyCam()}}
function animCam(t,ms=260){return new Promise(res=>{if(!t)return res();const c=cam(),s={...c},t0=performance.now();
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){Object.assign(c,t);applyCam();return res()}
  if(document.hidden){Object.assign(c,t);applyCam();return res()}
  // Always finish: frames stop arriving in background tabs, and a stuck animation would block zooming between levels.
  UI.anim=true;let done=false;const finish=()=>{if(done)return;done=true;Object.assign(c,t);applyCam();UI.anim=false;res()};
  const step=now=>{if(done)return;const k=Math.min(1,(now-t0)/ms),e=k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;c.x=s.x+(t.x-s.x)*e;c.y=s.y+(t.y-s.y)*e;c.z=s.z+(t.z-s.z)*e;applyCam();if(k<1)requestAnimationFrame(step);else finish()};
  requestAnimationFrame(step);setTimeout(finish,ms+150)})}
function zoomAt(cx,cy,f,discrete=false){const vp=$('#vp');if(!vp)return;const r=vp.getBoundingClientRect(),c=cam();const px=cx-r.left,py=cy-r.top;const nz=clamp(c.z*f,ZMIN,ZMAX);const wx=(px-c.x)/c.z,wy=(py-c.y)/c.z;c.x=px-wx*nz;c.y=py-wy*nz;c.z=nz;applyCam();semantic(px,py,f,discrete)}
function zoomCenter(f){const vp=$('#vp');if(!vp)return;const r=vp.getBoundingClientRect();zoomAt(r.left+r.width/2,r.top+r.height/2,f,true)}
function fitSel(){const b=curBoard();const sel=b.items.filter(i=>UI.sel.has(i.id));if(!sel.length){fit();return}animCam(fitTo(bounds(sel),60,ZMAX),380)}

/* ---------- hierarchy navigation ---------- */
/* Semantic zoom. Discrete steps (keys, buttons) fire immediately; wheel and pinch get a short cooldown so one gesture can't skip two levels. */
function semTarget(b,c,px,py){const wx=(px-c.x)/c.z,wy=(py-c.y)/c.z;const ok=i=>i.type==='card'||i.type==='project'||i.type==='room'||!!i.child;
  let it=[...b.items].reverse().find(i=>ok(i)&&wx>=i.x&&wx<=i.x+i.w&&wy>=i.y&&wy<=i.y+i.h);
  if(!it){const vp=$('#vp');const [cx,cy]=[(vp.clientWidth/2-c.x)/c.z,(vp.clientHeight/2-c.y)/c.z];let best=null,bd=Infinity;
    for(const i of b.items){if(!ok(i))continue;const d=Math.hypot(i.x+i.w/2-cx,i.y+i.h/2-cy);if(d<bd&&d<Math.max(i.w,i.h)*.75){bd=d;best=i}}it=best}
  return it}
function semReady(it,c,W,H){const sw=it.w*c.z,sh=it.h*c.z;if(it.type==='project'||it.type==='room')return Math.max(sw/W,sh/H);return Math.max(sw/(W*.42),sh/(H*.5))*(c.z>=1.6?1:c.z/1.6)}
function setArming(id){$$('#items .it.arming').forEach(el=>{if(el.dataset.id!==id)el.classList.remove('arming')});if(id)$(`#items [data-id="${id}"]`)?.classList.add('arming')}
function semantic(px,py,f,discrete=false){if(!S.settings.semantic||UI.anim||UI.drag){setArming(null);return}
  const cool=discrete?0:320;if(performance.now()-UI.lastSem<cool)return;const c=cam(),b=curBoard(),vp=$('#vp');if(!vp)return;const W=vp.clientWidth,H=vp.clientHeight;
  if(f>1){const it=semTarget(b,c,px,py);if(!it){setArming(null);return}const r=semReady(it,c,W,H);const need=(it.type==='project'||it.type==='room')?.82:1;
    if(r>=need){setArming(null);UI.lastSem=performance.now();dive(it,true);return}setArming(r>=need*.72?it.id:null)}
  else if(f<1){setArming(null);if(!b.parent)return;const bb=b.items.length?bounds(b.items):null;const frac=bb?Math.max(bb.w*c.z/W,bb.h*c.z/H):c.z;
    const pb=S.boards[b.parent.board];const lim=pb&&pb.id==='WORLD'?.58:.45;if(frac<lim||c.z<.06){UI.lastSem=performance.now();goUp(true)}}}
function diveProject(it,fromZoom){const p=projById(it.pid);if(!p)return;ensureWorld();const root=S.boards[p.root];const t=tileMap(it,root),c=cam();
  const last=root.cam&&root.cam.z?{...root.cam}:null;
  root.cam={x:c.x+c.z*(it.x+t.ax),y:c.y+c.z*(it.y+t.ay),z:c.z*t.s};S.ui.project=p.id;S.ui.board=root.id;UI.sel.clear();UI.selLink=null;UI.lastSem=performance.now();
  renderBoard();if(!fromZoom){if(last&&root.items.length)animCam(last,460);else if(root.items.length)animCam(fitTo(bounds(root.items)),460);else fit(true)}save()}
async function dive(it,fromZoom){if(!it||UI.anim||['section','text','timeline','ink'].includes(it.type))return;if(UI.editing)finishEdit();if(it.type==='project'){diveProject(it,fromZoom);return}if(it.type==='room'){startRoom(it,fromZoom);return}const b=curBoard();let child=it.child&&S.boards[it.child];
  if(!child){child=newBoard(b.projectId,b.level+1,{board:b.id,item:it.id});it.child=child.id;save()}
  await animCam(fitTo({minX:it.x,minY:it.y,w:it.w,h:it.h},10,ZMAX),fromZoom?260:340);
  S.ui.board=child.id;UI.sel.clear();UI.selLink=null;renderBoardBody();if(!child.cam)fit(false);
  const w=$('#world');if(w&&w.animate)w.animate([{opacity:0},{opacity:1}],{duration:300,easing:'cubic-bezier(.2,.8,.2,1)'});UI.lastSem=performance.now();save()}
async function goUp(fromZoom){const b=curBoard();if(!b||!b.parent||UI.anim)return;if(UI.editing)finishEdit();const pb=S.boards[b.parent.board];if(!pb)return;const itId=b.parent.item;
  if(pb.id==='WORLD'){ensureWorld();const it=pb.items.find(i=>i.id===itId);const rc=cam();S.ui.board='WORLD';UI.sel=new Set(it?[itId]:[]);
    if(it){const t=tileMap(it,b);const z=rc.z/t.s;pb.cam={x:rc.x-z*(it.x+t.ax),y:rc.y-z*(it.y+t.ay),z}}
    renderBoard();if(!fromZoom&&pb.items.length)await animCam(fitTo(bounds(pb.items),60,1),420);UI.lastSem=performance.now();save();return}
  S.ui.board=pb.id;UI.sel=new Set([itId]);renderBoardBody();const it=getItem(itId);
  if(it&&pb.items.length){Object.assign(cam(),fitTo({minX:it.x,minY:it.y,w:it.w,h:it.h},10,ZMAX));applyCam();await animCam(fitTo(bounds(pb.items),60,1.2),fromZoom?380:420)}
  UI.lastSem=performance.now();save()}
function goBoard(id){if(!S.boards[id])return;S.ui.board=id;UI.sel.clear();UI.selLink=null;renderBoardBody();if(!S.boards[id].cam)fit(false);save()}
function locate(boardId,itemId){S.ui.board=boardId;UI.outline=false;UI.sel=new Set([itemId]);renderBoard();const it=getItem(itemId);if(it){Object.assign(cam(),fitTo({minX:it.x-200,minY:it.y-160,w:it.w+400,h:it.h+320},40,1.2));applyCam()}}

/* ---------- rendering ---------- */
function itemHTML(it,b){
  const sel=UI.sel.has(it.id)?' sel':'';
  const dim=UI.track&&!NODIM.includes(it.type)&&!String(it.tracks||'').includes(UI.track)?' dim':'';
  const pos=`left:${it.x}px;top:${it.y}px;width:${it.w}px;height:${it.h}px;`;
  const kid=it.child&&S.boards[it.child];const kItems=kid?kid.items.filter(i=>i.type!=='section'&&i.type!=='text'):[];
  const cl=childLevelName(b).toLowerCase();
  const dv=`<button class="dive" data-dive="${it.id}" title="Open this ${esc(it.type==='frame'?'frame':'card')} (Enter)">${kItems.length?`${kItems.length} ${esc(cl)}`:'Open'} ›</button>`;
  const mini=kItems.length?`<span class="mini" aria-hidden="true">${kItems.slice(0,18).map(i=>`<i style="--mc:${i.type==='frame'?'#55595f':colorOf(i)}"></i>`).join('')}</span>`:'';
  const rz='<i class="rz" aria-hidden="true"></i>';
  const ph=(v,p)=>v?esc(v):`<span class="phx">${p}</span>`;
  const stripes=it.tracks?`<span class="stripes" aria-hidden="true">${[...it.tracks].map(k=>`<i style="background:${TRACK_C[k]||'#999'}"></i>`).join('')}</span>`:'';
  const base=`data-id="${it.id}" style="${pos}`;
  switch(it.type){
    case 'room':{const R=ROOMS[it.room];if(!R)return '';const lay=(ROOM_LAYOUTS.find(x=>x[0]===it.layout)||ROOM_LAYOUTS[0]);
      return `<div class="it room${sel}" ${base}--rc:${R.color};--rf:${R.font}"><div class="rin"><div><span class="rk">Writers’ room · ${esc(R.tag)}</span><div class="rn">${esc(R.name)}</div><p class="rd">${esc(R.desc)}</p><div class="ra">${R.acts.map((a,i)=>`<span><i>${['I','II','III'][i]}</i>${esc(a.name)}</span>`).join('')}</div></div><div class="rpv" aria-hidden="true">${roomPreview(lay[0],R.color)}</div></div><div class="rcta"><b>${esc(lay[1])}</b>Empty. Zoom in to start a project</div><button class="dive" data-dive="${it.id}">Start ›</button>${rz}</div>`}
    case 'project':{const p=projById(it.pid);if(!p)return '';const root=S.boards[p.root];const t=tileMap(it,root);const ri=root?root.items.filter(i=>i.type==='section').concat(root.items.filter(i=>i.type!=='section')):[];
      return `<div class="it ptile${sel}" ${base}--pc:${esc(p.color||'#c8372d')}"><div class="pvw" aria-hidden="true"><div class="pvbox" style="transform:translate(${t.ax}px,${t.ay}px) scale(${t.s})">${ri.map(i=>itemHTML(i,root)).join('')}</div></div>
      <div class="phd"><span class="pk">${esc([KINDS[p.kind],p.genre,p.stage].filter(Boolean).join(' · '))}</span><b>${esc(p.title)}</b><span class="pl">${esc(p.logline||'')}</span></div>${ri.length?'':'<span class="pempty">Empty wall. Zoom in or click Open to start.</span>'}<button class="dive" data-dive="${it.id}">Open ›</button>${rz}</div>`}
    case 'section':{let aud='';const cards=b.items.filter(o=>o.type==='card'&&inside(o,it));
      if(cards.length){const p=projById(b.projectId);const tn=(p&&p.tracks)||{};const cnt={};Object.keys(TRACK_C).forEach(k=>cnt[k]=cards.filter(c=>String(c.tracks||'').includes(k)).length);
        const open=cards.filter(c=>c.status==='Open'||c.status==='Proposed').length;
        aud=`<span class="aud">${Object.keys(TRACK_C).filter(k=>cnt[k]).map(k=>`<span title="${esc(tn[k]||k)}"><i style="background:${TRACK_C[k]}"></i>${cnt[k]}</span>`).join('')}<span>${cards.length} cards</span>${!cnt.A?`<em>⚑ No ${esc(tn.A||'A-story')} card</em>`:''}${open?`<em>${open} open</em>`:''}</span>`}
      return `<div class="it section${sel}" ${base}--c:${PAPER[it.color]||PAPER.blue}"><div class="sh"><span class="t" data-f="title">${ph(it.title,'Section')}</span><span class="sm" data-f="body">${esc(it.body||'')}</span>${aud}</div>${rz}</div>`}
    case 'text':return `<div class="it text${sel}" ${base}"><span class="t" data-f="title">${ph(it.title,'Label')}</span>${rz}</div>`;
    case 'image':return `<div class="it image${sel}" ${base}">${it.img?`<img src="${it.img}" alt="${esc(it.title||'')}" draggable="false">`:'<span class="phx" style="margin:auto">Double-click to add an image</span>'}<span class="cap" data-f="title">${esc(it.title||'')}</span>${rz}</div>`;
    case 'note':return `<div class="it note${sel}${dim}" ${base}--c:${colorOf(it)};--r:${tilt(it.id)}deg">${stripes}<span class="t" data-f="title">${ph(it.title,'Idea…')}</span>${it.child?`<span class="cf">${mini}${dv}</span>`:''}${rz}</div>`;
    case 'sticky':return `<div class="it sticky${sel}${dim}" ${base}--c:${colorOf(it)}">${stripes}<i class="tape" aria-hidden="true"></i><span class="t" data-f="title">${ph(it.title,'Note…')}</span>${it.child?`<span class="cf">${mini}${dv}</span>`:''}${rz}</div>`;
    case 'timeline':{const ms=String(it.body||'').split('\n').map(s=>s.trim()).filter(Boolean),n=ms.length;
      const mk=ms.map((m,i)=>`<span class="tm" style="left:${n>1?3+i*92/(n-1):50}%"><i></i><em class="${i%2?'dn':'up'}">${esc(m)}</em></span>`).join('');
      return `<div class="it timeline${sel}" ${base}--c:${colorOf(it)}"><span class="t" data-f="title">${ph(it.title,'Timeline')}</span><div class="tl">${mk||'<span class="tm" style="left:50%"><i></i><em class="dn phx">Add markers in the panel</em></span>'}</div>${rz}</div>`}
    case 'ink':return `<div class="it ink${sel}" ${base}"><svg viewBox="0 0 ${it.vw||it.w} ${it.vh||it.h}" preserveAspectRatio="none" width="100%" height="100%" aria-hidden="true"><path d="${inkPath(it.pts||[])}" stroke="${colorOf(it)}" stroke-width="${it.sw||4}" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>${rz}</div>`;
    case 'frame':{const s=it.shot||{};return `<div class="it frame${sel}${dim}" ${base}">${stripes}<div class="fh"><b>${esc(it.num||'—')}</b><span>${esc(s.size||'')}${s.angle&&s.angle!=='Eye level'?' · '+esc(s.angle):''}${s.lens?' · '+esc(s.lens):''}</span>${s.dur?`<span class="dur">${esc(s.dur)}</span>`:''}</div><div class="fimg">${it.img?`<img src="${it.img}" alt="" draggable="false">`:'<span>Double-click to sketch</span>'}${s.move&&s.move!=='Static'?`<span class="fmove">${esc(s.move)}</span>`:''}</div><div class="fcap" data-f="title">${ph(it.title,'Action…')}</div>${it.dialogue?`<div class="fdl">${esc(it.dialogue)}</div>`:''}${it.child?`<span class="cf">${mini}${dv}</span>`:''}${rz}</div>`}

    case 'distH':{snap();const s=[...sel].sort((a,b)=>a.x-b.x);let x=s[0].x;s.forEach(i=>{i.x=x;x+=i.w+24});renderItems();save();break}
    case 'distV':{snap();const s=[...sel].sort((a,b)=>a.y-b.y);let y=s[0].y;s.forEach(i=>{i.y=y;y+=i.h+24});renderItems();save();break}
    case 'grid':case 'row':{snap();const s=readingOrder(sel);const bb=bounds(s);const cols=a.dataset.ia==='row'?s.length:Math.ceil(Math.sqrt(s.length));const cw=Math.max(...s.map(i=>i.w))+24,ch=Math.max(...s.map(i=>i.h))+24;s.forEach((i,k)=>{i.x=bb.minX+(k%cols)*cw;i.y=bb.minY+Math.floor(k/cols)*ch});renderItems();save();break}
    case 'wrap':{snap();const s=sel.filter(i=>i.type!=='section');if(!s.length)break;const bb=bounds(s);const sec=mkItem('section',bb.minX-40,bb.minY-90,{w:bb.w+80,h:bb.h+130,title:'New section'});b.items.unshift(sec);UI.sel=new Set([sec.id]);renderItems();renderInspector();save();break}
    case 'renumber':renumber(b);break;
    case 'arrange':{snap();const ts=b.items.filter(i=>i.type==='project');ts.forEach((t,k)=>{t.x=(k%3)*2000;t.y=Math.floor(k/3)*1400;t.w=1600;t.h=1000});renderItems();fit();save();break}
    case 'fit':fit();break;
    case 'linkdel':{snap();b.links=b.links.filter(l=>l.id!==UI.selLink);UI.selLink=null;renderLinks();renderInspector();save();break}
    case 'linkflip':{snap();const l=b.links.find(x=>x.id===UI.selLink);if(l){[l.a,l.b]=[l.b,l.a]}renderLinks();save();break}
  }}
function deleteSel(){const b=curBoard();const tiles=[...UI.sel].filter(id=>getItem(id)?.type==='project');if(tiles.length){tiles.forEach(id=>UI.sel.delete(id));toast('To remove a project, delete it from Slate');if(!UI.sel.size){refreshSel();return}}if(UI.selLink&&!UI.sel.size){snap();b.links=b.links.filter(l=>l.id!==UI.selLink);UI.selLink=null;renderLinks();renderInspector();save();return}
  if(!UI.sel.size)return;snap();const n=UI.sel.size;b.items=b.items.filter(i=>!UI.sel.has(i.id));b.links=b.links.filter(l=>!UI.sel.has(l.a)&&!UI.sel.has(l.b));UI.sel.clear();renderItems();renderInspector();save();toast(n+' deleted · Ctrl+Z to undo')}
function cloneItems(items,dx,dy){const map=new Map();const out=items.map(i=>{const c=deep(i);c.id=uid('i');c.child=null;c.x+=dx;c.y+=dy;map.set(i.id,c.id);return c});return {out,map}}
function duplicateSel(){const b=curBoard();const sel=b.items.filter(i=>UI.sel.has(i.id)&&i.type!=='project');if(!sel.length)return;snap();const {out,map}=cloneItems(sel,32,32);
  b.links.filter(l=>map.has(l.a)&&map.has(l.b)).forEach(l=>b.links.push({id:uid('l'),a:map.get(l.a),b:map.get(l.b),label:l.label}));
  out.forEach(c=>c.type==='section'?b.items.unshift(c):b.items.push(c));UI.sel=new Set(out.map(c=>c.id));renderItems();renderInspector();save()}
function copySel(){const b=curBoard();const sel=b.items.filter(i=>UI.sel.has(i.id)&&i.type!=='project');if(!sel.length)return;UI.clip={items:deep(sel),links:deep(b.links.filter(l=>UI.sel.has(l.a)&&UI.sel.has(l.b)))};
  UI.clipText=readingOrder(sel).map(i=>i.title).filter(Boolean).join('\n');try{navigator.clipboard?.writeText(UI.clipText||' ').catch(()=>{})}catch(e){}toast(sel.length+' copied')}
function pasteClip(){if(!UI.clip)return;const b=curBoard();snap();const bb=bounds(UI.clip.items);const [cx,cy]=viewCenter();const {out,map}=cloneItems(UI.clip.items,Math.round(cx-bb.minX-bb.w/2),Math.round(cy-bb.minY-bb.h/2));
  UI.clip.links.forEach(l=>b.links.push({id:uid('l'),a:map.get(l.a),b:map.get(l.b),label:l.label}));out.forEach(c=>c.type==='section'?b.items.unshift(c):b.items.push(c));UI.sel=new Set(out.map(c=>c.id));renderItems();renderInspector();save()}
function notesFromText(txt){const lines=txt.split(/\r?\n/).map(s=>s.replace(/^\s*([-*•]|\d+[.)])\s*/,'').trim()).filter(Boolean).slice(0,60);if(!lines.length)return;
  const b=curBoard();snap();const [cx,cy]=viewCenter();const cols=Math.min(6,Math.ceil(Math.sqrt(lines.length)));const cs=[...Object.keys(NOTE)];const ids=[];
  lines.forEach((t,k)=>{const it=mkItem('note',cx-(cols*196)/2+(k%cols)*196,cy-80+Math.floor(k/cols)*196,{title:t,color:cs[k%3]});b.items.push(it);ids.push(it.id)});UI.sel=new Set(ids);renderItems();renderInspector();save();toast(lines.length+' Post-its from pasted text')}
function renumber(b){snap();const order=readingOrder(b.items);const cards=order.filter(i=>i.type==='card'),frames=order.filter(i=>i.type==='frame');
  cards.forEach((c,k)=>c.num=String(k+1));

  frames.forEach((f,k)=>f.num=(pre||'')+(k<26?String.fromCharCode(65+k):String(k+1)));renderItems();save();toast('Renumbered '+(cards.length+frames.length)+' items')}

function renderOutline(){const el=$('#outline');if(!el)return;const p=curProject();const root=S.boards[p.root];
  el.innerHTML=`<div class="vhead" style="margin-bottom:8px"><div><span class="eyebrow">Outline · every level of ${esc(p.title)}</span><h1 style="font-size:34px">${esc(p.title)}</h1></div><div class="row"><button class="btn sm" id="olExpand">Expand all</button><button class="btn sm" id="olCollapse">Collapse all</button><button class="btn sm" id="olCopy">${ic('copy')}Copy as text</button></div></div>${p.logline?`<p class="help" style="max-width:70ch;margin-bottom:10px">${esc(p.logline)}</p>`:''}<div class="olb">${olBoard(root,0)}</div>`;
  $('#olExpand').onclick=()=>{UI.olClosed.clear();renderOutline()};
  $('#olCollapse').onclick=()=>{for(const id in S.boards){const b=S.boards[id];if(b.projectId===p.id)b.items.forEach(i=>i.child&&UI.olClosed.add(i.id))}renderOutline()};
  $('#olCopy').onclick=()=>copyText(outlineText(root,0),'Outline copied');
  el.onclick=e=>{const t=e.target.closest('[data-olt]');if(t){const id=t.dataset.olt;UI.olClosed.has(id)?UI.olClosed.delete(id):UI.olClosed.add(id);renderOutline();return}
    const g=e.target.closest('[data-goto]');if(g){const [bid,iid]=g.dataset.goto.split(':');S.ui.project=S.boards[bid].projectId;locate(bid,iid)}};
  el.oninput=e=>{const t=e.target.closest('[data-oli]');if(!t)return;const [bid,iid]=t.dataset.oli.split(':');const it=S.boards[bid]?.items.find(i=>i.id===iid);if(it){it.title=t.value;save()}}}
function olBoard(b,depth){if(!b||depth>12)return '';const order=readingOrder(b.items).filter(i=>['card','note','sticky','frame'].includes(i.type));const secs=b.items.filter(i=>i.type==='section').sort((a,c)=>a.y-c.y||a.x-c.x);
  if(!order.length)return `<p class="empty">Nothing on this board yet.</p>`;let out='',cur=-2;
  for(const it of order){const si=secs.findIndex(s=>inside(it,s));if(si!==cur){cur=si;if(si>=0)out+=`<div class="olsec">${esc(secs[si].title||'Section')}${secs[si].body?` <span class="help" style="text-transform:none;font-family:var(--f-body)">${esc(secs[si].body)}</span>`:''}</div>`}
    const kid=it.child&&S.boards[it.child];const has=kid&&kid.items.length;const open=has&&!UI.olClosed.has(it.id);
    out+=`<div class="olr"><button class="tg" data-olt="${it.id}" ${has?'':'disabled style="visibility:hidden"'} aria-label="${open?'Collapse':'Expand'}">${open?'▾':'▸'}</button><span class="n">${esc(it.num||'')}</span><div><input data-oli="${b.id}:${it.id}" value="${esc(it.title)}" placeholder="${it.type==='note'?'Post-it':'Untitled'}" aria-label="Title">${it.body?`<div class="ex">${esc(it.body.slice(0,240))}</div>`:''}${it.type==='frame'&&it.shot?`<div class="ex">${esc([it.shot.size,it.shot.angle!=='Eye level'?it.shot.angle:'',it.shot.move!=='Static'?it.shot.move:''].filter(Boolean).join(' · '))}${it.dialogue?' — “'+esc(it.dialogue)+'”':''}</div>`:''}</div><span class="row" style="gap:6px">${it.status?`<span class="pill" style="--pc:${ST_C[it.status]}">${esc(it.status)}</span>`:''}${it.type!=='card'?`<span class="chip">${it.type==='note'?'Post-it':'Frame'}</span>`:''}<button class="btn sm ghost" data-goto="${b.id}:${it.id}">Show</button></span></div>`;
    if(open)out+=`<div class="olkids"><div class="olkh">${esc(levelName(kid))}</div>${olBoard(kid,depth+1)}</div>`}return out}
function outlineText(b,depth){if(!b||depth>12)return '';const ind='  '.repeat(depth);let s='';for(const it of readingOrder(b.items).filter(i=>['card','note','sticky','frame'].includes(i.type))){s+=`${ind}${it.num?it.num+'. ':'- '}${it.title||'Untitled'}\n`;if(it.body)s+=`${ind}  ${it.body.replace(/\n/g,' ')}\n`;if(it.child)s+=outlineText(S.boards[it.child],depth+1)}return s}

/* ---------- keyboard & paste ---------- */
function boardKeys(e,mod){const k=e.key;
  if(k===' '){UI.space=true;$('#vp')?.classList.add('pan');e.preventDefault();return}
  if(mod&&(k==='z'||k==='Z')){e.preventDefault();undoRedo(e.shiftKey);return}
  if(mod&&(k==='y'||k==='Y')){e.preventDefault();undoRedo(true);return}
  if(mod&&(k==='a'||k==='A')){e.preventDefault();UI.sel=new Set(curBoard().items.map(i=>i.id));refreshSel();return}
  if(mod&&(k==='c'||k==='C')){copySel();return}
  if(mod&&(k==='d'||k==='D')){e.preventDefault();duplicateSel();return}
  if(mod)return;
  if(k==='Delete'||k==='Backspace'){e.preventDefault();deleteSel();return}
  if(k==='Escape'){UI.sel.clear();UI.selLink=null;UI.tool='select';renderTools();refreshSel();renderLinks();return}
  if(k==='Enter'&&UI.sel.size===1){e.preventDefault();dive(getItem([...UI.sel][0]));return}
  if(k==='u'||k==='U'||(e.altKey&&k==='ArrowUp')){goUp();return}
  if(k.startsWith('Arrow')&&UI.sel.size){e.preventDefault();const s=e.shiftKey?10:1;const dx=k==='ArrowLeft'?-s:k==='ArrowRight'?s:0,dy=k==='ArrowUp'?-s:k==='ArrowDown'?s:0;snap();for(const id of UI.sel){const it=getItem(id);if(it){it.x+=dx;it.y+=dy}}renderItems();save();return}
  if(k==='='||k==='+'){zoomCenter(1.25);return}if(k==='-'||k==='_'){zoomCenter(.8);return}if(k==='0'){fit();return}if(k==='z'||k==='Z'){fitSel();return}
  if(k==='b'||k==='B'){UI.flipAll=!UI.flipAll;$('#bFlip')?.setAttribute('aria-pressed',UI.flipAll);renderItems();return}
  const map={j:'project',v:'select',h:'hand',i:'card',n:'note',k:'sticky',f:'frame',t:'text',s:'section',l:'timeline',p:'pen',c:'connect'};const t=map[k.toLowerCase()];if(t){UI.tool=t;renderTools()}}
function initBoardGlobal(){
  window.addEventListener('pointermove',onMove);window.addEventListener('pointerup',onUp);window.addEventListener('pointercancel',onUp);
  document.addEventListener('click',inspClick);
  document.addEventListener('click',e=>{if(e.target.closest('[data-gen]'))openGen()});
  document.addEventListener('keyup',e=>{if(e.key===' '){UI.space=false;$('#vp')?.classList.toggle('pan',UI.tool==='hand')}});
  document.addEventListener('paste',e=>{if(S.ui.view!=='board'||UI.outline||!$('#vp'))return;const t=e.target;if(t.closest&&t.closest('input,textarea,[contenteditable],#modal,#drawer'))return;
    const fs=[...(e.clipboardData?.files||[])].filter(f=>/^image\//.test(f.type));e.preventDefault();
    if(fs.length){const [wx,wy]=viewCenter();addImages(fs,wx,wy);return}
    const txt=e.clipboardData?.getData('text/plain')||'';if(UI.clip&&(txt===UI.clipText||txt.trim()===''||txt===' ')){pasteClip();return}if(txt.trim())notesFromText(txt);else if(UI.clip)pasteClip()});
  bindInspector()}

function seasonBeats(n){n=clamp(n|0,3,24);const out=[];for(let k=1;k<=n;k++){const a=k<=Math.ceil(n/3)?0:k<=Math.ceil(2*n/3)?1:2;
  let t='Escalation: complicate the goal ({G}); deepen {O}.';if(k===1)t='Pilot: establish {W}, {P} and the engine of the series.';else if(k===2)t='Second pilot: prove the engine works week to week.';
  else if(k===Math.round(n/2))t='Midseason turn: a revelation reframes the season question.';else if(k===n-1)t='Penultimate: the biggest set piece; all seems lost.';else if(k===n)t='Finale: answer the season question and open the next.';
  out.push([`Episode ${k}`,a,0,t,k===n?'AB':'A'])}return out}
function tok(p,k){const v={P:p.protagonist||'the protagonist',G:p.goal||'reach the goal',O:p.obstacle||'the opposition',S:p.stakes||'everything is on the line',I:p.inciting||'Something breaks the routine',W:p.world||'their world',T:p.themes||'the theme'}[k];return v??''}
function fillT(s,p){let r=s.replace(/\{(\w)\}/g,(m,k)=>tok(p,k));r=r.replace(/(^|[.!?]\s+)([a-z])/g,(m,a,b)=>a+b.toUpperCase());return r}
const SEC_COLORS=['blue','green','goldenrod','pink','buff','salmon'];
function genBeats(b,key,opts={}){const p=projById(b.projectId),fw=FW[key];if(!fw||!p)return;if(!opts.silent)snap('board',b.id);
  const beats=key==='season'?seasonBeats(opts.n||8):fw.beats;let x0=0,y0=0;if(b.items.length){const bb=bounds(b.items);x0=bb.minX;y0=bb.maxY+140}
  const CW=240,CH=160,G=24,PER=5,PAD=36,HEAD=86,SW=PAD*2+PER*CW+(PER-1)*G;
  b.items.push(mkItem('text',x0,y0,{title:`${p.title} · ${fw.short}`,w:SW,h:60}));y0+=96;
  const usePages=fw.pages!==false&&p.target;
  fw.acts.forEach((act,ai)=>{const list=beats.filter(bt=>bt[1]===ai);if(!list.length)return;const rows=Math.ceil(list.length/PER),sh=HEAD+rows*CH+(rows-1)*G+PAD;
    const pr=usePages?`pp. ${Math.max(1,Math.round(Math.min(...list.map(x=>x[2]))/100*p.target))}–${Math.round(Math.max(...list.map(x=>x[2]))/100*p.target)}`:`${list.length} ${list.length===1?'beat':'beats'}`;
    b.items.push(mkItem('section',x0,y0,{title:act,body:pr,w:SW,h:sh,color:SEC_COLORS[ai%SEC_COLORS.length]}));
    list.forEach((bt,i)=>{const r=Math.floor(i/PER),c=i%PER;b.items.push(mkItem('card',x0+PAD+c*(CW+G),y0+HEAD+r*(CH+G),{title:bt[0],body:fillT(bt[3],p),num:usePages?'p. '+Math.max(1,Math.round(bt[2]/100*p.target)):'',status:'Outline',tracks:bt[4]||'A'}))});
    y0+=sh+56});
